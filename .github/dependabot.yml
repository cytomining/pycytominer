# GitHub Dependabot configuration
# Note: there is no interaction between this configuration and Dependabot security updates.
# See here for more information:
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/about-dependabot-security-updates#about-dependabot-security-updates

version: 2
updates:
  # Cooldown docs:
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown
  # GitHub Actions checks
  # See here for more information:
  # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates
  - package-ecosystem: "github-actions"
    # checks for updates by default under `/.github/workflows`
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # checks for updates under custom action setup-env
    directory: "/.github/actions/setup-env"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      setup-env-actions:
        patterns:
          - "*"

  # Perform checks and updates for the Python uv environment.
  # See here for more information:
  # https://docs.astral.sh/uv/guides/integration/dependabot/
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Check for updates to uv environment files every month
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      python-packages:
        patterns:
          - "*"
    ignore:
      # ignore cytominer-database as it is deprecated
      - dependency-name: "cytominer-database"
      # csvkit>=2 drops the csvclean `-n` flag that cytominer-database==0.3.4 depends on
      - dependency-name: "csvkit"
        update-types: ["version-update:semver-major"]
      # pandas-stubs 3.x stubs pandas 3.x, which removes keyword arguments still
      # used against the supported pandas 2.x runtime (e.g. `rename(copy=...)`
      # in pycytominer.cyto_utils.cells). Keep stubs on the runtime major until
      # the project migrates to pandas 3.
      - dependency-name: "pandas-stubs"
        update-types: ["version-update:semver-major"]

  # Perform checks and updates for pre-commit hook versions.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      # Check for updates to pre-commit hooks every month
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
