---
name: almanack

on:
  push:
    branches:
      - main
  schedule:
    # runs every Monday at 7 AM UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  almanack-check:
    name: Software gardening check
    # Only run on the upstream repo, never on forks, so results always
    # reflect the canonical cytomining/pycytominer repository.
    if: github.repository == 'cytomining/pycytominer'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          cache-pre-commit: false
          cache-venv: false
          setup-uv: true
          install-deps: false

      - name: Run almanack check
        run: uvx almanack==0.1.17 check .
